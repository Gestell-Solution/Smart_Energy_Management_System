name: smart_energy_app
description: Gestell Smart Energy Management System - Mobile Application for real-time energy monitoring
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.0

  # Bluetooth Communication (Classic - for HC-05) - Android only
  flutter_bluetooth_serial: ^0.4.0

  # Charts & Visualization
  fl_chart: ^0.66.0
  syncfusion_flutter_gauges: ^24.2.9

  # Local Storage
  shared_preferences: ^2.2.0

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.3

  # Data Export
  csv: ^6.0.0

  # Permissions & Location
  permission_handler: ^11.3.1
  location: ^5.0.3

  # UI & Styling
  google_fonts: ^6.2.1
  animations: ^2.0.11

  # Utilities
  intl: ^0.19.0

  url_launcher: ^6.2.5

  # Web-specific dependencies
  universal_html: ^2.2.4  # For web HTML support
  js: ^0.6.7  # For JavaScript interop on web

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Platform-specific configurations
  # Android and Web supported only
